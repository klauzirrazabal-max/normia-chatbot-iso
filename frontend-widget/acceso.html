<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Entrar · NormIA</title>
<link rel="stylesheet" href="normia.css" />
<style>
  /* La pantalla de acceso solo necesita centrar la caja: el resto -- colores,
     tipografia, campos, botones -- viene del sistema. */
  body { min-height: 100vh; display: grid; place-items: center; padding: var(--e5); }

  .caja {
    width: 100%; max-width: 370px;
    background: var(--superficie); border: 1px solid var(--borde);
    border-radius: var(--radio); padding: var(--e6) var(--e5);
    box-shadow: var(--sombra);
  }

  /* El sello del membrete. Es el detalle del oficio: un documento controlado
     lleva su codigo arriba, y esta pantalla es la portada del sistema que los
     guarda. */
  .membrete {
    font-family: var(--codigo); font-size: 11px; letter-spacing: .08em;
    color: var(--tinta-suave); text-transform: uppercase;
    border-bottom: 1px solid var(--borde); padding-bottom: var(--e3);
    margin-bottom: var(--e5); display: flex; justify-content: space-between;
  }

  h1 { font-size: 24px; margin-bottom: var(--e1); }
  .sub { color: var(--tinta-suave); font-size: 13.5px; margin: 0 0 var(--e5); }
  label { margin-top: var(--e4); }
  button[type="submit"] { width: 100%; justify-content: center; margin-top: var(--e5); }

  .fallo {
    margin-top: var(--e4); padding: var(--e3);
    border-radius: var(--radio-sm); font-size: 13.5px;
    background: var(--riesgo-fondo); border: 1px solid var(--riesgo-borde);
    color: var(--riesgo);
  }
  .pie {
    margin-top: var(--e5); padding-top: var(--e4);
    border-top: 1px solid var(--borde);
    font-size: 12.5px; color: var(--tinta-suave); line-height: 1.5;
  }
</style>
</head>
<body>
<main class="caja">
  <div class="membrete"><span>Sistema de gestión</span><span>Acceso</span></div>
  <h1>NormIA</h1>
  <p class="sub">Asistente del sistema de gestión</p>

  <form id="formulario">
    <label class="etiqueta" for="email">Correo</label>
    <input class="campo" id="email" type="email" autocomplete="username" required autofocus />

    <label class="etiqueta" for="password">Contraseña</label>
    <input class="campo" id="password" type="password" autocomplete="current-password" required />

    <button class="boton boton-principal" type="submit" id="boton">Entrar</button>
  </form>

  <div class="fallo" id="fallo" hidden></div>

  <p class="pie" id="pie">Las consultas y los documentos no salen de esta máquina.</p>
</main>

<script>
const API = window.NORMIA_API || "";
const $ = (id) => document.getElementById(id);

// Si ya hay sesion no tiene sentido pedirla otra vez.
fetch(`${API}/api/auth/yo`, { credentials: "same-origin" })
  .then((r) => r.json())
  .then((d) => { if (d.autenticado) irDondeTocaba(d); })
  .catch(() => {});

function irDondeTocaba(usuario) {
  const volver = new URLSearchParams(location.search).get("volver");
  if (volver && /^[a-z0-9_-]+\.html$/i.test(volver)) {
    // Solo nombres de pagina: un "volver" con una URL completa seria una
    // redireccion abierta hacia donde quisiera quien monte el enlace.
    location.replace(volver);
    return;
  }
  location.replace("inicio.html");
}

$("formulario").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("fallo").hidden = true;
  $("boton").disabled = true;
  $("boton").textContent = "Entrando…";
  try {
    const r = await fetch(`${API}/api/auth/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "same-origin",
      body: JSON.stringify({ email: $("email").value, password: $("password").value }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) {
      $("fallo").textContent = d.detail || "No se pudo entrar.";
      $("fallo").hidden = false;
      return;
    }
    irDondeTocaba(d);
  } catch {
    $("fallo").textContent =
      "No hay conexión con NormIA. Comprueba tu red e inténtalo de nuevo.";
    $("fallo").hidden = false;
  } finally {
    $("boton").disabled = false;
    $("boton").textContent = "Entrar";
  }
});
</script>
</body>
</html>
