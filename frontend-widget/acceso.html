<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Entrar · NormIA</title>
<style>
  :root {
    --papel:#f1f5f9; --panel:#fff; --tinta:#0f172a; --suave:#64748b;
    --linea:#e2e8f0; --marca:#2563eb; --error:#b91c1c;
  }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
    background:var(--papel); color:var(--tinta);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  .caja {
    width:100%; max-width:380px; background:var(--panel);
    border:1px solid var(--linea); border-radius:12px; padding:30px 28px;
    box-shadow:0 1px 3px rgba(15,23,42,.06);
  }
  h1 { margin:0 0 4px; font-size:21px; }
  .sub { color:var(--suave); font-size:13.5px; margin:0 0 22px; }
  label { display:block; font-size:12px; font-weight:600; color:var(--suave);
          text-transform:uppercase; letter-spacing:.04em; margin:14px 0 6px; }
  input {
    width:100%; padding:10px 12px; font-size:14.5px; font-family:inherit;
    border:1px solid var(--linea); border-radius:8px; background:#f8fafc;
  }
  input:focus { outline:2px solid var(--marca); outline-offset:-1px; background:#fff; }
  button {
    width:100%; margin-top:20px; padding:11px; font-size:14.5px; font-weight:600;
    font-family:inherit; color:#fff; background:var(--marca);
    border:none; border-radius:8px; cursor:pointer;
  }
  button:disabled { opacity:.6; cursor:progress; }
  .fallo {
    margin-top:16px; padding:10px 12px; border-radius:8px; font-size:13.5px;
    background:#fef2f2; border:1px solid #fecaca; color:var(--error);
  }
  [hidden] { display:none !important; }
  .pie { margin-top:20px; font-size:12.5px; color:var(--suave); line-height:1.5; }
</style>
</head>
<body>
<main class="caja">
  <h1>NormIA</h1>
  <p class="sub">Asistente del sistema de gestión</p>

  <form id="formulario">
    <label for="email">Correo</label>
    <input id="email" type="email" autocomplete="username" required autofocus />

    <label for="password">Contraseña</label>
    <input id="password" type="password" autocomplete="current-password" required />

    <button type="submit" id="boton">Entrar</button>
  </form>

  <div class="fallo" id="fallo" hidden></div>

  <p class="pie" id="pie"></p>
</main>

<script>
const API = window.NORMIA_API || "";
const $ = (id) => document.getElementById(id);

// Si ya hay sesion no tiene sentido pedirla otra vez.
fetch(`${API}/api/auth/yo`, { credentials: "same-origin" })
  .then((r) => r.json())
  .then((d) => { if (d.autenticado) irDondeTocaba(d); })
  .catch(() => {});

function irDondeTocaba(usuario) {
  const volver = new URLSearchParams(location.search).get("volver");
  if (volver && /^[a-z0-9_-]+\.html$/i.test(volver)) {
    // Solo nombres de pagina: un "volver" con una URL completa seria una
    // redireccion abierta hacia donde quisiera quien monte el enlace.
    location.replace(volver);
    return;
  }
  location.replace(usuario.puede_gestionar ? "admin.html" : "demo.html");
}

$("formulario").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("fallo").hidden = true;
  $("boton").disabled = true;
  $("boton").textContent = "Entrando…";
  try {
    const r = await fetch(`${API}/api/auth/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "same-origin",
      body: JSON.stringify({ email: $("email").value, password: $("password").value }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) {
      $("fallo").textContent = d.detail || "No se pudo entrar.";
      $("fallo").hidden = false;
      return;
    }
    irDondeTocaba(d);
  } catch {
    $("fallo").textContent =
      "No hay conexión con NormIA. Comprueba tu red e inténtalo de nuevo.";
    $("fallo").hidden = false;
  } finally {
    $("boton").disabled = false;
    $("boton").textContent = "Entrar";
  }
});
</script>
</body>
</html>
