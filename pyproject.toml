[project]
name = "normia"
version = "0.1.0"
description = "Asistente de documentacion y cumplimiento ISO con RAG + agentes"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "sqlalchemy>=2.0.35",
    "psycopg[binary]>=3.2.3",
    "pgvector>=0.3.4",
    "sentence-transformers>=3.1.1",
    "pdfplumber>=0.11.4",
    "httpx>=0.27.2",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "nbformat>=5.11.1",
    "pytest>=8.3.3",
    "ruff>=0.7.0",
]
finetune = [
    "mlx>=0.32.2",
    "mlx-lm>=0.31.3",
]
imagen = [
    "accelerate>=1.15.0",
    "diffusers>=0.40.0",
    "mflux>=0.20.0",
    "safetensors>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint.flake8-bugbear]
# Depends()/Query()/Path() en los defaults es el idiom estandar de FastAPI,
# no el bug mutable-default que B008 busca.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.UploadFile",
]

[tool.ruff.lint.per-file-ignores]
# Los scripts ajustan sys.path antes de importar app.*
"scripts/*" = ["E402"]
# El corpus de demo lleva filas de tabla dentro de literales de texto: son
# largas porque el documento que imitan lo es.
"scripts/generate_demo_corpus.py" = ["E402", "E501"]
# Las laminas de la presentacion son HTML dentro de literales. Trocearlo para
# cumplir el ancho de linea lo volveria ilegible y propenso a errores de espaciado.
"scripts/_laminas_fase2.py" = ["E501"]
"scripts/construir_presentacion.py" = ["E402", "E501"]
# El notebook lleva celdas de codigo dentro de literales: trocearlas para
# cumplir el ancho de linea romperia la indentacion del codigo generado.
"scripts/construir_notebook.py" = ["E501"]
"scripts/construir_ejecutiva.py" = ["E402", "E501"]
